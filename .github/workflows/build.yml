name: Build

on:
  push:
    branches: [ "**" ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One jar per Minecraft version.
        mc: [ '26.1', '26.1.1', '26.1.2', '26.2', '26.3' ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build for Minecraft ${{ matrix.mc }}
        run: ./gradlew build -Pmc=${{ matrix.mc }} --no-daemon --stacktrace

      - name: Upload URC for ${{ matrix.mc }}
        uses: actions/upload-artifact@v4
        with:
          name: URC-${{ matrix.mc }}
          path: build/libs/*.jar
          if-no-files-found: error
